# Builds the Castfy desktop installers.
#
# Two ways to start it:
#   - push a branch like `release/desktop-v0.1.0`: builds, then makes a draft
#     GitHub Release `desktop-v0.1.0` with the installers;
#   - by hand from the Actions tab: builds only.
#
# Not on tags. Publishing that draft creates the `desktop-v0.1.0` tag, and a
# tag trigger then rebuilt the same commit and reworked the published release.
#
# Each target builds on its own runner: castfy0's ffmpeg, Remotion's compositor,
# rspack and esbuild all install a native binary for the host only.
#
# Needs one repository secret:
#   CASTFY0_TOKEN  a GitHub token that can read Yves-Developer/castfy0
#                  (fine-grained, Contents: read-only on that repository,
#                  with an expiry date).
#
# macOS builds are signed and notarized when these secrets are set, and
# unsigned (right-click → Open the first time) when they are not:
#   MAC_CERT_P12_BASE64  the "Developer ID Application" certificate with its
#                        private key, exported as .p12, then base64
#   MAC_CERT_PASSWORD    the .p12's password
#   APPLE_API_KEY_P8     an App Store Connect API key (.p8 file contents)
#   APPLE_API_KEY_ID     that key's id
#   APPLE_API_ISSUER     the issuer id shown above the keys
#
# Neither checkout keeps its credentials once it finishes (persist-credentials:
# false). The build installs hundreds of third-party packages, and a token left
# in .git/config would be readable by every one of their install scripts.

name: Desktop release

on:
  workflow_dispatch:
    inputs:
      castfy0_ref:
        description: castfy0 branch or tag to bundle
        default: main
  push:
    branches:
      - "release/desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            script: dist:win
            arch: x64
          - name: macOS Apple Silicon
            runner: macos-15
            script: dist:mac
            arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            script: dist:mac
            arch: x64

    steps:
      - name: Check out castfy
        uses: actions/checkout@v4
        with:
          path: castfy
          persist-credentials: false

      - name: Check out castfy0
        uses: actions/checkout@v4
        with:
          repository: Yves-Developer/castfy0
          ref: ${{ inputs.castfy0_ref || 'main' }}
          token: ${{ secrets.CASTFY0_TOKEN }}
          path: castfy0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: castfy/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: castfy/pnpm-lock.yaml

      - name: Build castfy0
        working-directory: castfy0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Filtered to the desktop app and what it uses, which also skips the
      # playground's private registry dependency — no NODE_AUTH_TOKEN needed.
      - name: Install dependencies
        working-directory: castfy
        run: pnpm install --frozen-lockfile --filter "@workspace/desktop..."

      - name: Typecheck
        working-directory: castfy
        run: pnpm --filter @workspace/desktop typecheck

      # The production backend the app signs in to, from the repository's
      # Actions variables (Settings → Secrets and variables → Actions →
      # Variables). Unset, the committed castfy.config.json is shipped as is.
      - name: Point the app at the backend
        if: ${{ vars.CASTFY_CONVEX_URL != '' }}
        working-directory: castfy/apps/desktop
        env:
          CASTFY_CONVEX_URL: ${{ vars.CASTFY_CONVEX_URL }}
          CASTFY_WEB_URL: ${{ vars.CASTFY_WEB_URL }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "castfy.config.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.convexUrl = process.env.CASTFY_CONVEX_URL;
            if (process.env.CASTFY_WEB_URL) config.webUrl = process.env.CASTFY_WEB_URL;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '

      # Hands electron-builder the signing certificate and the notarization
      # key, as files in the runner's temp folder, on macOS only: given a
      # certificate on Windows it would try to sign the .exe with it. Without
      # the secrets, or on Windows, the build stays unsigned on purpose.
      - name: Prepare signing
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$RUNNER_OS" != "macOS" ] || [ -z "$MAC_CERT_P12_BASE64" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Building unsigned."
            exit 0
          fi
          cert="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$cert"
          {
            echo "CSC_LINK=$cert"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing with the Developer ID certificate."

          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            {
              echo "APPLE_API_KEY=$key"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "Notarizing with the App Store Connect API key."
          else
            echo "::warning::No App Store Connect API key: the app is signed but not notarized, so macOS will still warn on first open."
          fi

      - name: Package
        working-directory: castfy
        env:
          CASTFY0_DIR: ${{ github.workspace }}/castfy0
          TARGET_ARCH: ${{ matrix.arch }}
        run: pnpm --filter @workspace/desktop ${{ matrix.script }} --${{ matrix.arch }} --publish never

      # Fails the build when a signed app is not what Gatekeeper accepts, so a
      # broken signature never reaches testers as a "damaged" app.
      - name: Check the signature
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        working-directory: castfy/apps/desktop/release
        shell: bash
        run: |
          app=$(find . -maxdepth 2 -name "Castfy.app" -type d | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          if [ -n "$APPLE_API_KEY" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi

      - name: Forget the signing files
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: castfy-${{ runner.os }}-${{ matrix.arch }}
          path: |
            castfy/apps/desktop/release/*.exe
            castfy/apps/desktop/release/*.dmg
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/heads/release/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # From release/desktop-vX, the tag desktop-vX, which the release step
      # creates on the built commit when the draft is published.
      - name: Work out the tag
        id: tag
        run: echo "name=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: installers/*
