# Packaging for the Castfy desktop app.
#
#   pnpm dist:dir   unpacked app in release/, for a quick local check
#   pnpm dist:win   Windows installer (.exe)  — build on Windows
#   pnpm dist:mac   macOS disk image (.dmg)   — build on macOS
#
# Each platform and architecture builds on its own machine: castfy0's ffmpeg,
# Remotion's compositor and esbuild all install a native binary for the host
# only, so a cross-built package would carry the wrong ones.

appId: app.castfy.desktop
productName: Castfy
copyright: Copyright © Castfy

directories:
  output: release
  buildResources: build-resources

# Not an archive. Remotion bundles the export composition with webpack at
# runtime and launches native compositor binaries, and neither works from inside
# app.asar. Revisit once the composition is pre-bundled at build time (Phase 2).
asar: false

files:
  - package.json
  - "*.js"
  - preload.cjs
  # The backend the app signs in to and checks plans with (main.js).
  - castfy.config.json
  - remotion/**
  - dist-renderer/**
  - "!scripts/**"
  - "!src/**"
  - "!public/**"
  - "!build/**"
  - "!release/**"
  - "!vite.config.ts"
  - "!tsconfig.json"

# The recording engine, staged by scripts/stage-castfy0.mjs, is copied into
# <resources>/castfy0-mcp by this hook (not extraResources, which drops its
# node_modules).
afterPack: scripts/after-pack.cjs
# Notarizes and staples, with retries (see the script).
afterSign: scripts/notarize.cjs

icon: public/web-app-manifest-512x512.png
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Where the app looks for updates (updater.js): the site serves the latest
# published release's files there (apps/web/app/updates). Builds run with
# --publish never, so this uploads nothing; it is written into the app, and
# makes the build write latest.yml / latest-mac.yml for the release. The
# channel stays "latest" although versions are betas, so those are the names
# the updater asks for.
publish:
  provider: generic
  url: https://castfy.app/updates
detectUpdateChannel: false

win:
  target:
    - target: nsis
      arch: [x64]
  # Every size Windows draws (16 to 256px) in one .ico, each made on its own
  # so the arrow stays sharp on the taskbar, and opaque: the shared icon is
  # see-through, which looked washed out on a light taskbar.
  icon: build-resources/icon-win.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Castfy

mac:
  target:
    - target: dmg
    # What an update installs: macOS updates from a zip of the app, not a dmg.
    - target: zip
  category: public.app-category.video
  # Apple's icon template: the shape is 824px wide on a 1024px canvas, with
  # room for its shadow. The shared icon fills its canvas edge to edge, so in
  # the Dock it was drawn bigger than every other app. Same arrow, in white on
  # black, lit from above.
  icon: build-resources/icon-mac.png
  # Signed and notarized in CI when the Developer ID secrets are set (see
  # .github/workflows/desktop-release.yml); unsigned otherwise.
  hardenedRuntime: true
  gatekeeperAssess: false
  # Done in scripts/notarize.cjs (afterSign) instead, which retries what a
  # dropped connection to Apple breaks; electron-builder's own does not.
  notarize: false
  # castfy0 runs as Castfy itself in Node mode (ELECTRON_RUN_AS_NODE), which the
  # hardened runtime only allows with JIT entitlements.
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist

dmg:
  sign: false

linux:
  # Otherwise named after the workspace package ("@workspacedesktop").
  executableName: castfy
  target:
    - target: AppImage
  category: Video
